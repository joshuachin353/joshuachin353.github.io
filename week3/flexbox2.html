<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox2</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oxygen:wght@300;400;700&family=Space+Grotesk:wght@300..700&family=Syne+Mono&display=swap');

        body {
            font-family: "Space Grotesk", sans-serif;
            margin: 0px;
        }


        .container {
            max-width: 1440px;
            margin: auto;
            padding: 0 100px;
        }

        .hero {
            justify-content: space-between;
            align-items: center;
            min-height: 100px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hamburger {
            display: none;
        }

        .logo {
            display: flex;
            width: 220px;
            height: 36px;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .logo img {
            width: 30px;
            height: 30px;
        }

        .logo h2 {
            margin: 0;
            font-size: 28px;
            width: 170px;
            height: 30px;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 40px;
            font-size: 15px;
            justify-content: center;
        }

        .quote {
            padding: 15px 25px;
            border: 1px solid black;
            border-radius: 10px;
            background: white;
            font-size: 15px;
            display: flex;
            gap: 10px;
        }


        .font {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            gap: 40px;
            align-items: flex-start;
        }

        .left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 30px;
            width: 50%;
        }

        .right {
            max-width: 50%;

        }

        .right1 {
            display: none;
        }

        h1 {
            font-size: 55px;
            margin: 0;
            line-height: normal;
        }

        p {
            font-size: 20px;
            line-height: normal;
        }

        .book {
            background: #191A23;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            margin-top: 10px;
            display: flex;
            padding: 20px 35px;
            align-items: flex-start;
            gap: 10px;
        }

        .companylogo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            filter: grayscale(100%) brightness(0);
            gap: 30px;
            margin-top: 10px;
        }


        .servicestitle {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-top: 80px;
        }

        .servicestitle h2 {
            background: #B9FF66;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 35px;
            margin: 0;

        }

        .services-title p {
            font-size: 18px;
            width: 50%;
        }

        .services {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            margin-top: 40px;
        }

        .service-card {
            border: 1px solid #191A23;
            border-bottom: 6px solid #191A23;
            border-radius: 30px;
            padding: 35px;
            min-height: 250px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .service-card h3 {
            font-size: 30px;
            margin: 0;
        }

        .service-card h3 span {
            border-radius: 5px;
            padding: 2px 6px;
        }

        .card-img {
            width: 45%;
        }

        .learn {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 80px;
            font-size: 25px;
            padding: 30px;
        }

        .learn img {
            width: 50px;
        }

        .learn.white {
            color: white;
        }


        .card1 {
            background: #F3F3F3;
        }

        .card1 h3 span {
            background: #B9FF66;
        }

        .card2 {
            background: #B9FF66;
        }

        .card2 h3 span {
            background: white;
        }

        .card3 {
            background: #191A23;
        }

        .card3 h3 span {
            background: white;
            color: black;
        }

        .card4 {
            background: #F3F3F3;
        }

        .card4 h3 span {
            background: #B9FF66;
        }

        .card5 {
            background: #B9FF66;
        }

        .card5 h3 span {
            background: white;
        }

        .card6 {
            background: #191A23;
        }

        .card6 h3 span {
            background: #B9FF66;
            color: black;
        }

        .learn {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 70px;
            font-size: 18px;
        }

        .learn img {
            width: 40px;
        }

        .learn.white {
            color: white;
        }

        .down {
            display: flex;
            padding: 0 100px;
            align-items: center;
            gap: 300px;
            border-radius: 45px;
            background: #F3F3F3;
            margin-top: 70px;
        }

        .downtext {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }

        .downtext h3 {
            font-size: 30px;
            margin: 0;
        }

        .downtext p {
            font-size: 20px;
        }

        .get {
            display: flex;
            padding: 20px 35px;
            align-items: flex-start;
            gap: 10px;
            border-radius: 14px;
            background: black;
            color: white;
            font-size: 20px;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="hero">


            <div class="top">

                <div class="logo">
                    <img src="week3 image/Icon.png" alt="icon" width="100%">
                    <h2>Positivus</h2>
                </div>

                <div class="menu">
                    <div>About us</div>
                    <div>Services</div>
                    <div>Use Cases</div>
                    <div>Pricing</div>
                    <div>Blog</div>
                    <div><button class="quote"> Request a quote</button></div>


                </div>
                <div class="hamburger"><img src="week3 image/hamburger menu.png" alt="hamburger" width="10%"></div>

            </div>

            <div class="font">

                <div class="left">

                    <h1>Navigating the<br>digital landscape<br>for success</h1>
                    <div class="right1">
                        <img src="week3 image/Illustration (1).png" alt="illustration" width="100%">
                    </div>

                    <p>
                        Our digital marketing agency helps businesses<br> grow and
                        succeed online through a range of<br> services including SEO,
                        PPC, social media marketing,<br> and content creation.
                    </p>

                    <button class="book">Book a consultation</button>

                </div>

                <div class="right">
                    <img src="week3 image/Illustration (1).png" alt="illustration" width="100%">
                </div>

            </div>

            <div class="companylogo">
                <div>
                    <img src="week3 image/Company logo (6).png" alt="amazon" width="100%">
                </div>

                <div>
                    <img src="week3 image/Company logo (7).png" alt="drillle" width="100%">
                </div>

                <div>
                    <img src="week3 image/Company logo (8).png" alt="hub" width="100%">
                </div>

                <div>
                    <img src="week3 image/Company logo (9).png" alt="notion" width="100%">
                </div>

                <div>
                    <img src="week3 image/Company logo (10).png" alt="netflix" width="100%">
                </div>

                <div>
                    <img src="week3 image/Company logo (11).png" alt="zoom" width="100%">
                </div>
            </div>

        </div>

    </div>

</body>

</html>
