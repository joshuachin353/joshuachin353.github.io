<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Menu</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /* White Navigation Bar */

        .navbar {
            width: 95%;
            margin: 20px auto;
            background: white;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 25px;
        }

        .logo img {
            height: 35px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: black;
            font-size: 14px;
        }

        .phone {
            font-size: 14px;
        }

        .contact-btn button {
            background: #ff6a2c;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .hamburger {
            display: none;
            font-size: 28px;
            cursor: pointer;
        }

        @media (max-width:900px) {

            .nav-links {
                display: none;
            }

            .contact-btn {
                display: none;
            }

            .hamburger {
                display: block;
            }

        }

        @media (max-width:600px) {

            .phone {
                display: none;
            }

        }
    </style>

</head>

<body>

    <header class="navbar">

        <div class="logo">
            <img src="ChatGPT Image Jun 30, 2026, 11_10_01 AM.png" alt="Elementra">
        </div>

        <div class="nav-links">
            <div>
                <p>Home</p>
            </div>
            <div>
                <p>Services</p>
            </div>
            <div>
                <p>Work</p>
            </div>
            <div>
                <p>Project Details</p>
            </div>
            <div>
                <p>Contact</p>
            </div>
        </div>

        <div class="phone">
            📞 555-123-4567
        </div>

        <div class="contact-btn">
            <button>Contact</button>
        </div>

        <div class="hamburger">
            ☰
        </div>

    </header>

</body>

</html>

</html>
