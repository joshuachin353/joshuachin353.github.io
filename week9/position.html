<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Business Hero Section</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      width: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /*======================
 HERO SECTION
=======================*/

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;

      background:
        radial-gradient(circle at top right,
          rgba(255, 255, 255, .05) 0%,
          rgba(255, 255, 255, .05) 22%,
          transparent 22%),

        radial-gradient(circle at bottom right,
          rgba(0, 102, 255, .18) 0%,
          rgba(0, 102, 255, .18) 28%,
          transparent 28%),

        linear-gradient(135deg, #1B1E7D, #02031F);
    }

    /*======================
 IMAGE
=======================*/

    .hero-image {
      position: absolute;

      width: 68%;
      height: 78%;

      left: 16%;
      top: 11%;

      border-radius: 8px;
      overflow: hidden;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(37, 50, 170, .35);
    }

    /*======================
 EXPERIENCE CARD
=======================*/

    .experience {

      position: absolute;

      left: 8%;
      bottom: 12%;

      width: 22%;
      max-width: 240px;
      min-width: 180px;

      background: #D8FF00;

      padding: 24px;

      border-radius: 8px;

      box-shadow: 0 15px 30px rgba(0, 0, 0, .25);

      z-index: 5;
    }

    .experience h2 {

      font-size: clamp(42px, 5vw, 64px);
      color: #111;

    }

    .line {

      width: 75%;
      height: 2px;

      background: #222;

      margin: 15px 0;

    }

    .experience p {

      color: #333;
      font-size: 14px;

    }

    /*======================
 REVENUE CARD
=======================*/

    .revenue {

      position: absolute;

      top: 15%;
      right: 8%;

      width: 18%;
      max-width: 190px;
      min-width: 160px;

      background: #fff;

      padding: 18px;

      border-radius: 8px;

      box-shadow: 0 15px 30px rgba(0, 0, 0, .25);

      z-index: 5;

    }

    .revenue h3 {

      font-size: clamp(20px, 2vw, 34px);
      color: #222;

    }

    .revenue span {

      color: #89d300;

    }

    .progress {

      width: 100%;
      height: 6px;

      background: #ddd;

      border-radius: 20px;

      margin: 12px 0;

    }

    .fill {

      width: 87%;
      height: 100%;

      background: #D8FF00;

      border-radius: 20px;

    }

    .revenue p {

      color: #666;
      font-size: 13px;

    }

    /*======================
 TABLET
=======================*/

    @media(max-width:900px) {

      .hero {

        height: 100vh;

      }

      .hero-image {

        width: 76%;
        height: 72%;

        left: 12%;
        top: 12%;

      }

      .experience {

        left: 4%;
        bottom: 8%;

        width: 180px;

      }

      .revenue {

        right: 4%;
        top: 8%;

        width: 170px;

      }

    }

    /*======================
 MOBILE
=======================*/

    @media(max-width:600px) {

      .hero {

        height: 100vh;

      }

      .hero-image {

        width: 90%;
        height: 56%;

        left: 5%;
        top: 8%;

      }

      .experience {

        left: 5%;
        bottom: 8%;

        width: 165px;

        padding: 18px;

      }

      .revenue {

        right: 5%;
        top: 5%;

        width: 160px;

        padding: 15px;

      }

      .experience h2 {

        font-size: 42px;

      }

      .revenue h3 {

        font-size: 24px;

      }

    }
  </style>

</head>

<body>

  <section class="hero">

    <!-- Main Image -->
    <div class="hero-image">
      <img src="custom-img-11-copyright.jpg" alt="Businessman">
    </div>

    <!-- Experience Card -->
    <div class="experience">

      <h2>20+</h2>

      <div class="line"></div>

      <p>Years of experience</p>

    </div>

    <!-- Revenue Card -->
    <div class="revenue">

      <h3>87.2% <span>▲</span></h3>

      <div class="progress">
        <div class="fill"></div>
      </div>

      <p>Revenue growth</p>

    </div>

  </section>

</body>

</html>
