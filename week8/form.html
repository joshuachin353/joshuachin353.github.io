<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <style>
        .top {
            border-radius: 40px;
            background-color: rgb(169, 167, 167);
            display: flex;
            justify-content: left;
            align-items: left;
            margin: 10px;
            padding: 10px;
        }
    </style>
</head>

<body>
    <form class="top">
        <input type="radio" id="what" name="choice">
        <label for="what">one player</label>
        <input type="radio" id="who" name="choice">
        <label for="who">siblings</label>
    </form>

    <h1>Registration Form - Middle School</h1>

    <form>
        <input type="radio" id="a" name="number">
        <label for="a">player 1</label>
        <input type="radio" id="b" name="number">
        <label for="b">player2</label>
    </form>

    <form>
        <label for="fname">First name:</label>
        <label for="lname">Last name:</label><br>
        <input type="text" id="fname" name="fname" required>
        <input type="text" id="lname" name="lname" required><br>
        <label for="Grade level">Grade level:</label>
        <label for="school">School attending:</label><br>
        <input type="text" id="Skill level" name="Skill level" required>
        <input type="text" id="school" name="school" required><br>
        <label for="skill level">Skill level:</label>
        <label for="size">T-shit size:</label><br>
        <input type="text" id="skill level" name="Skill level" required>
        <input type="text" id="size" name="size" required><br>
        <label for="email">Email:</label>
        <label for="confirm email">Confirm Email:</label><br>
        <input type="email" id="email" name="email" required>
        <input type="email" id="confirm email" name="confirm email" required><br>
        <label for="Phone">Guardian's phone number:</label><br>
        <input type="tel" id="Phone" name="Phone" required><br><br>
        <input type="submit" value="Next player ->">

    </form>
</body>

</html>
